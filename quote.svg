<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-label="Lessons earned the hard way, shared the easy way.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111828"/>
      <stop offset="100%" stop-color="#0D131F"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="178" rx="14" fill="url(#card)" stroke="#232A3D" stroke-width="1.5"/>
  <rect x="1" y="1" width="6" height="178" rx="3" fill="#EDE7CF"/>

  <text x="44" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="#EDE7CF" opacity="0.35">&#8220;</text>

  <text x="110" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#EDE7CF">Every generation deserves a few shortcuts.</text>
  <text x="110" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#EDE7CF">Lessons earned the hard way, shared the easy way.</text>

  <text x="110" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#717A90">&#8212; THE RIFT</text>
</svg>
