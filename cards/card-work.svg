<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Work With Me: hire Saqib 1:1 as your Operating Partner">
  <style>
    .t{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
    @keyframes nudge{0%,70%,100%{transform:translateX(0)}80%{transform:translateX(6px)}}
    .arr{animation:nudge 3.2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  </style>
  <defs><radialGradient id="g"><stop offset="0" stop-color="#EDE7CF" stop-opacity=".22"/><stop offset="1" stop-color="#EDE7CF" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="1000" height="150" rx="16"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="150" fill="#05070E"/>
    <ellipse cx="960" cy="10" rx="320" ry="135" fill="url(#g)"/>
    <rect width="5" height="150" fill="#EDE7CF"/>
  </g>
  <rect x=".5" y=".5" width="999" height="149" rx="16" fill="none" stroke="#232838"/>
  <text class="t" x="34" y="56" font-size="30" font-weight="700" fill="#F4F6FB" >Work With Me</text>
  <text class="t" x="34" y="88" font-size="18" font-weight="600" fill="#EDE7CF">The Right Lever Shifts the Paradigm.</text>
  <text class="t" x="34" y="118" font-size="15" fill="#AEB4C4">Hire me 1:1 as your Operating Partner. I find what's worth fixing and Drive it to Done.</text>
  <g transform="translate(770 51)">
    <rect width="196" height="48" rx="24" fill="#EDE7CF"/>
    <text class="t" x="84" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#030712">Book a Call</text>
    <g class="arr"><path d="M152 24h18M163 17l7 7-7 7" fill="none" stroke="#030712" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
