<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Saqib Tahir. Generalist at Heart, Specialist at Getting it Done.">
  <style>
    .t{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,24px)}}
    @keyframes draw{0%{stroke-dashoffset:420}35%,100%{stroke-dashoffset:0}}
    .glow{animation:drift 14s ease-in-out infinite;transform-box:fill-box}
    .brush{stroke-dasharray:420;animation:draw 7s cubic-bezier(.22,1,.36,1) infinite}
    @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D131F"/><stop offset="1" stop-color="#111828"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#515CF6" stop-opacity=".55"/><stop offset="1" stop-color="#515CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#EDE7CF" stop-opacity=".16"/><stop offset="1" stop-color="#EDE7CF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#232A3D"/></pattern>
    <clipPath id="clip"><rect width="1000" height="270" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="270" fill="url(#bg)"/>
    <rect width="1000" height="270" fill="url(#dots)" opacity=".55"/>
    <ellipse class="glow" cx="820" cy="40" rx="320" ry="220" fill="url(#g1)"/>
    <ellipse cx="980" cy="270" rx="260" ry="160" fill="url(#g2)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="269" rx="20" fill="none" stroke="#232A3D"/>

  <text class="t" x="64" y="112" font-size="58" font-weight="700" fill="#F4F6FB" letter-spacing="-1">Saqib Tahir</text>
  <text class="t" x="66" y="160" font-size="25" font-weight="600" fill="#AEB4C4">Generalist at <tspan fill="#9AA0FB">Heart</tspan></text>
  <text class="t" x="66" y="196" font-size="25" font-weight="600" fill="#AEB4C4">Specialist at Getting it <tspan fill="#9AA0FB">Done</tspan></text>
  <path class="brush" d="M64 214 C 150 206, 260 222, 380 210" fill="none" stroke="#515CF6" stroke-width="5" stroke-linecap="round"/>

</svg>
